{{ define "main" }}
  <main class="archive-page"><a class="back-link" href="{{ site.Home.RelPermalink }}">← 返回首页</a><div class="section-heading"><div><p class="eyebrow">THE JOURNAL</p><h1>{{ if eq .Section "posts" }}所有文章{{ else }}{{ .Title }}{{ end }}<span class="accent">.</span></h1></div></div><div class="post-list">{{ range .Pages }}<article class="post-card"><div class="post-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time></div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Summary | plainify | truncate 170 }}</p><div class="post-bottom"><span>{{ .ReadingTime }} 分钟阅读</span><a href="{{ .RelPermalink }}">阅读全文 ↗</a></div></article>{{ else }}<p>暂时还没有文章。</p>{{ end }}</div></main>
{{ end }}
